<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="title">
  <title id="title">Orb Tangle mark</title>
  <defs>
    <radialGradient id="blue" cx="30%" cy="24%"><stop stop-color="#fff"/><stop offset=".22" stop-color="#b9efff"/><stop offset=".55" stop-color="#55c6ff"/><stop offset="1" stop-color="#1784bd"/></radialGradient>
    <radialGradient id="coral" cx="30%" cy="24%"><stop stop-color="#fff"/><stop offset=".22" stop-color="#ffd4ce"/><stop offset=".55" stop-color="#ff7975"/><stop offset="1" stop-color="#bd485e"/></radialGradient>
    <radialGradient id="gold" cx="30%" cy="24%"><stop stop-color="#fff"/><stop offset=".22" stop-color="#fff3b4"/><stop offset=".55" stop-color="#ffd75c"/><stop offset="1" stop-color="#bd8b22"/></radialGradient>
